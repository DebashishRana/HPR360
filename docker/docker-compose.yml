services:
  mariadb:
    image: mariadb:10.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: 123
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis:alpine

  frappe:
    image: frappe/bench:latest
    user: root
    command: bash /workspace/init.sh
    environment:
      - SHELL=/bin/bash
      - HOME=/home/frappe
    working_dir: /home/frappe
    volumes:
      - .:/workspace
      - ../:/workspace/hpr360
      # Parent mount so bench init can create frappe-bench/ without moving a venv
      - frappe-bench-data:/home/frappe/benches
    ports:
      - 8000:8000
      - 9000:9000

volumes:
  mariadb-data:
  frappe-bench-data:
