[databases]
peoplepay360 = host=postgres port=5432 dbname=peoplepay360
peoplepay360_test = host=postgres port=5432 dbname=peoplepay360_test

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /tmp/peoplepay360-users.txt
pool_mode = session
max_client_conn = 100
default_pool_size = 20
min_pool_size = 2
reserve_pool_size = 5
reserve_pool_timeout = 3
server_reset_query = DISCARD ALL
server_connect_timeout = 15
server_idle_timeout = 600
client_idle_timeout = 0
ignore_startup_parameters = extra_float_digits,options
admin_users = peoplepay360_migrator
stats_users = peoplepay360_analytics
